<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            border-collapse: collapse;

        }

        thead {
            background-color: rgb(95, 89, 89);
        }

        caption {
            font-size: 1.3em;
            font-weight: bold;
            padding: 10px;
        }

        th,
        td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }

        .medias {
            text-align: left;
            background-color: rgb(95, 89, 89);
        }
    </style>
</head>

<body>
    <table>
        <thead>
            <tr>
                <th rowspan="2">Área</th>
                <th rowspan="2">Disciplínas</th>
                <th colspan="2">Notas</th>
                <th rowspan="2">Média</th>

            </tr>
            <tr>
                <th>Nota 1</th>
                <th>Nota 2</th>
            </tr>

        </thead>
        <tr>
            <th rowspan="3">Exatas</th>
            <td>Matematíca</td>
            <td>00</td>
            <td>00</td>
            <td>00</td>
        </tr>
        <tr>
            <td>Química</td>
            <td>00</td>
            <td>00</td>
            <td>00</td>
        </tr>
        <tr>
            <td>Biológia</td>
            <td>00</td>
            <td>00</td>
            <td>00</td>
        </tr>
        <tr>
            <th colspan="4" class="medias">Media de Exatas
            <td class="medias">00</td>
            </th>
        </tr>

        <tr>
            <th rowspan="3">Humanas</th>
            <td>História</td>
            <td>00</td>
            <td>00</td>
            <td>00</td>

        </tr>
        <tr>
            <td>Geográfia</td>
            <td>00</td>
            <td>00</td>
            <td>00</td>
        </tr>
        <tfoot>
            <th colspan="4" class="medias">Media de Humanas</th>
            <td class="medias">00</td>
        </tfoot>
    </table>

</body>

</html>
